services:
  frontend:
    image: owner/image:version
    container_name: frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - network-name
  backend:
    image: owner/image:version
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - network-name
networks:
  basal-net:
    driver: bridge
